[workspace]
resolver = "2"
members = ["engine/cf-schema"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/crowdflow-studio/crowdflow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "0.8"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# The simulation hot loop must not have float contraction applied
# inconsistently across targets — see docs/04-track-b-simulation-engine.md §5.
[profile.release.package.cf-schema]
opt-level = 2
