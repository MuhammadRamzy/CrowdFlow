[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crowdflow-services"
version = "0.1.0"
description = "CrowdFlow Studio floorplan import pipeline (DXF / vector PDF -> Venue document)"
requires-python = ">=3.12"
license = { file = "../LICENSE" }

# Every runtime dependency and its licence. Nothing AGPL/GPL/non-commercial may
# enter this list — see docs/07-infrastructure-and-cost.md §5.
#   pydantic       MIT
#   ezdxf          MIT
#   pdfminer.six   MIT
# Deliberately NOT used: PyMuPDF / fitz (AGPL-3.0).
dependencies = [
  "pydantic>=2.7",
  "ezdxf>=1.3",
  "pdfminer.six>=20231228",
]

[project.optional-dependencies]
# Development only — never shipped in the product path.
#   datamodel-code-generator  MIT   (generates importer/schema/ from schema/)
#   ruff                      MIT
#   mypy                      MIT
#   pytest                    MIT
#   jsonschema                MIT   (validates emitted docs against schema/)
#   pip-licenses              MIT   (the licence gate)
dev = [
  "datamodel-code-generator>=0.25",
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8",
  "jsonschema>=4.22",
  "pip-licenses>=5",
]

[project.scripts]
cf-import = "importer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["importer"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated code is the schema's business, not ours.
extend-exclude = ["importer/schema"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # isort
  "N",             # pep8-naming
  "UP",            # pyupgrade
  "B",             # bugbear
  "A",             # builtins shadowing
  "C4",            # comprehensions
  "SIM",           # simplify
  "RUF",
  "D",             # docstrings — every public thing explains *why*
]
ignore = [
  "D203",  # conflicts with D211
  "D213",  # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103", "D100"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["importer", "tests", "scripts"]
# Generated from schema/ by scripts/gen_models.py — not hand-written and not
# ours to make strict-clean. R1: the source of truth is engine/cf-schema, and
# the right response to a complaint here is to fix the generator, not the file.
[[tool.mypy.overrides]]
module = "importer.schema.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["jsonschema.*", "ezdxf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
