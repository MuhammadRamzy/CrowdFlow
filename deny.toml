# cargo-deny configuration.
#
# CrowdFlow Studio is an academic project intended for commercial entry, so a
# copyleft or non-commercial dependency anywhere in the product path is a
# blocking problem. Catching it here costs nothing; catching it during
# diligence costs a rewrite. See docs/07-infrastructure-and-cost.md §5.

[licenses]
version = 2
# Permissive only. Anything not on this list fails the build and needs a
# deliberate decision (plus an ADR) rather than a quiet exception.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Known-poisoned crates. These have permissively-licensed alternatives; see the
# licence audit table in docs/07-infrastructure-and-cost.md §5.
deny = []

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
